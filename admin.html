<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Panel | Malaika Tauqeer</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { 
      margin: 0; 
      background: #0a0e27; 
      color: #fff; 
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: linear-gradient(135deg, rgba(26,31,58,0.9), rgba(15,20,40,0.95));
      border: 2px solid #00d4ff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 0 60px rgba(0,212,255,0.15);
    }
    .logo { 
      font-family: 'Orbitron', monospace; 
      font-size: 2.5rem; 
      font-weight: 900;
      color: #00d4ff; 
      letter-spacing: 3px; 
      margin-bottom: 1rem; 
    }
    .bracket { color: #7b2fff; }
    h2 { 
      font-family: 'Orbitron', sans-serif; 
      font-size: 1.4rem; 
      letter-spacing: 2px; 
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .subtitle { 
      color: #8b95b5; 
      font-size: 0.9rem; 
      margin-bottom: 2rem; 
    }
    .input-wrap {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .input-wrap i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #00d4ff;
    }
    input { 
      width: 100%; 
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      background: rgba(10,14,39,0.6);
      border: 1px solid rgba(0,212,255,0.3);
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Rajdhani', sans-serif;
      box-sizing: border-box;
      transition: all 0.3s;
    }
    input:focus { 
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 20px rgba(0,212,255,0.3);
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #00d4ff, #7b2fff);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 1px;
      margin-top: 0.5rem;
      transition: all 0.3s;
    }
    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,212,255,0.4);
    }
    .message { 
      margin-top: 1rem; 
      font-size: 0.95rem;
      min-height: 1.5rem;
    }
    .success { color: #00ff88; }
    .error { color: #ff6b6b; }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #8b95b5;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    .back-link:hover { color: #00d4ff; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo"><span class="bracket">&lt;</span>MT<span class="bracket">/&gt;</span></div>
    <h2>Admin Panel</h2>
    <p class="subtitle">Enter password to continue</p>
    
    <div class="input-wrap">
      <i class="fas fa-lock"></i>
      <input type="password" id="pw" placeholder="Password" />
    </div>
    
    <button onclick="checkPassword()"><i class="fas fa-sign-in-alt"></i> Login</button>
    <div id="message" class="message"></div>
    
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
  </div>

  <script>
    const DEFAULT_PASSWORD = 'malaika2026';
    
    function checkPassword() {
      const pw = document.getElementById('pw').value;
      const msg = document.getElementById('message');
      
      if (pw === DEFAULT_PASSWORD) {
        msg.innerHTML = '<i class="fas fa-check-circle"></i> Login successful! Access granted.';
        msg.className = 'message success';
        setTimeout(() => {
          alert('Admin panel features will be added soon. Redirecting to portfolio...');
          window.location.href = 'index.html';
        }, 1000);
      } else {
        msg.innerHTML = '<i class="fas fa-times-circle"></i> Incorrect password. Try again.';
        msg.className = 'message error';
      }
    }
    
    // Enter key support
    document.getElementById('pw').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
